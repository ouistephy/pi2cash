services:
  - type: web
    name: pi2cash
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/migrate.js && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pi2cash-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RATE_XOF_PER_PI
        value: "100"
      - key: FEE_BPS
        value: "150"
      - key: PI_API_KEY
        sync: false

databases:
  - name: pi2cash-db
    plan: free
